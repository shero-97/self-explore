<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多研究你自己 — 自我探索记录站</title>
<link rel="icon" type="image/jpeg" href="myself-icon.jpg">
<style>
:root {
  --bg: #0f0f0f; --card: #1a1a2e; --card-hover: #222240;
  --accent: #e94560; --accent-soft: rgba(233,69,96,0.15);
  --text: #eaeaea; --text-dim: #888; --border: #2a2a4a;
  --success: #4ade80; --warning: #fbbf24; --info: #60a5fa;
  --purple: #a78bfa;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

/* ===== Header ===== */
.header { position:sticky; top:0; z-index:100; background:rgba(15,15,15,.92); backdrop-filter:blur(16px); border-bottom:1px solid var(--border); padding:16px 24px; display:flex; align-items:center; gap:12px; }
.header h1 { font-size:18px; font-weight:700; letter-spacing:1px; white-space:nowrap; }
.header h1 span { color:var(--accent); }
.header .nav-btn { padding:7px 16px; border-radius:20px; border:1px solid var(--border); background:transparent; color:var(--text); cursor:pointer; font-size:13px; transition:.2s; white-space:nowrap; }
.header .nav-btn:hover { border-color:var(--accent); color:var(--accent); }
.header .nav-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
.header .spacer { flex:1; }
.header .stat-pill { font-size:12px; color:var(--text-dim); background:var(--card); padding:5px 12px; border-radius:12px; border:1px solid var(--border); white-space:nowrap; }

/* ===== Main Layout ===== */
main { max-width:960px; margin:0 auto; padding:24px 16px 80px; }

/* ===== Category Grid ===== */
.cat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
.cat-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; cursor:pointer; transition:.25s; position:relative; overflow:hidden; }
.cat-card:hover { background:var(--card-hover); transform:translateY(-2px); border-color:rgba(233,69,96,.35); }
.cat-card .num { font-size:11px; color:var(--accent); font-weight:700; margin-bottom:6px; }
.cat-card .q-text { font-size:14.5px; line-height:1.55; font-weight:500; }
.cat-card .count-badge { position:absolute; top:12px; right:12px; font-size:11px; color:var(--text-dim); background:rgba(255,255,255,.06); padding:3px 10px; border-radius:10px; }
.cat-card .count-badge.has-record { color:var(--success); background:rgba(74,222,128,.12); }

/* ===== Detail View ===== */
.detail-view { display:none; }
.detail-view.show { display:block; animation:fadeIn .3s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

.back-bar { display:flex; align-items:center; gap:12px; margin-bottom:22px; }
.back-bar .back-btn { background:none; border:none; color:var(--accent); font-size:15px; cursor:pointer; display:flex; align-items:center; gap:6px; }
.back-bar .back-btn:hover { text-decoration:underline; }
.back-bar h2 { font-size:17px; line-height:1.4; }

/* ===== Options Area ===== */
.options-section { margin-top:16px; }
.section-label { font-size:13px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:12px; }
.option-chip { display:inline-block; padding:9px 18px; margin:5px 5px 5px 0; border:1px solid var(--border); border-radius:22px; font-size:13.5px; cursor:pointer; transition:.2s; user-select:none; }
.option-chip:hover { border-color:var(--accent); background:var(--accent-soft); }
.option-chip.selected { background:var(--accent); border-color:var(--accent); color:#fff; }
.option-chip.other { border-style:dashed; color:var(--info); }
.option-chip.other:hover, .option-chip.other.selected { border-color:var(--info); background:rgba(96,165,250,.15); color:var(--info); }
.option-chip.custom { border-style:dotted; color:var(--warning); }
.option-chip.custom:hover, .option-chip.custom.selected { border-color:var(--warning); background:rgba(251,191,36,.12); color:var(--warning); }

/* ===== Add Custom Option ===== */
.add-custom-row { display:flex; gap:8px; margin:10px 0 16px; align-items:center; }
.add-custom-row input { flex:1; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:9px 14px; color:var(--text); font-size:13px; outline:none; }
.add-custom-row input:focus { border-color:var(--warning); }
.add-custom-row button { padding:9px 18px; border-radius:10px; border:1px solid var(--warning); background:transparent; color:var(--warning); cursor:pointer; font-size:13px; }
.add-custom-row button:hover { background:rgba(251,191,36,.12); }

/* ===== Note & Save ===== */
.note-area { margin-top:18px; }
.note-area textarea { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:14px; color:var(--text); font-size:13.5px; resize:vertical; min-height:72px; outline:none; font-family:inherit; line-height:1.6; }
.note-area textarea:focus { border-color:var(--accent); }
.save-row { display:flex; gap:10px; margin-top:12px; align-items:center; }
.save-btn { padding:10px 28px; border-radius:10px; border:none; background:var(--accent); color:#fff; font-size:14px; font-weight:600; cursor:pointer; transition:.2s; }
.save-btn:hover { filter:brightness(1.15); }
.save-btn:disabled { opacity:.45; cursor:not-allowed; }
.save-msg { font-size:12px; color:var(--success); opacity:0; transition:.2s; }
.save-msg.show { opacity:1; }

/* ===== Records List ===== */
.records-list { margin-top:24px; }
.record-item { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px; position:relative; }
.record-item .r-option { font-weight:600; font-size:14px; color:var(--accent); margin-bottom:4px; }
.record-item .r-note { font-size:13px; color:var(--text-dim); line-height:1.5; }
.record-item .r-time { font-size:11px; color:#555; margin-top:6px; }
.record-item .del-btn { position:absolute; top:10px; right:10px; background:none; border:none; color:#666; cursor:pointer; font-size:16px; padding:4px 8px; border-radius:6px; }
.record-item .del-btn:hover { color:var(--accent); background:rgba(233,69,96,.1); }

/* ===== Summary Page ===== */
.summary-page { display:none; }
.summary-page.show { display:block; animation:fadeIn .3s ease; }
.profile-card { background:linear-gradient(135deg,var(--card),#1a1a3e); border:1px solid var(--border); border-radius:18px; padding:28px; margin-bottom:20px; }
.profile-card h3 { font-size:18px; margin-bottom:16px; color:var(--accent); }
.tag-cloud { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
.personality-tag { padding:6px 14px; border-radius:16px; font-size:12.5px; background:var(--accent-soft); color:var(--accent); border:1px solid rgba(233,69,96,.25); }
.personality-tag.neutral { background:rgba(96,165,250,.12); color:var(--info); border-color:rgba(96,165,250,.25); }
.personality-tag.warn { background:rgba(251,191,36,.12); color:var(--warning); border-color:rgba(251,191,36,.25); }
.insight-block { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:14px; }
.insight-block h4 { font-size:14.5px; margin-bottom:10px; color:var(--info); }
.insight-block p { font-size:13.5px; line-height:1.7; color:var(--text-dim); }
.stat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; margin-top:16px; }
.stat-mini { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
.stat-mini .label { font-size:12px; color:var(--text-dim); margin-bottom:6px; }
.stat-mini .value { font-size:22px; font-weight:700; color:var(--accent); }

/* ===== Library Page ===== */
.library-page { display:none; }
.library-page.show { display:block; animation:fadeIn .3s ease; }
.lib-toolbar { display:flex; gap:10px; margin-bottom:18px; align-items:center; flex-wrap:wrap; }
.lib-toolbar input { flex:1; min-width:200px; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:9px 14px; color:var(--text); font-size:13px; outline:none; }
.lib-toolbar input:focus { border-color:var(--purple); }
.lib-toolbar button { padding:9px 16px; border-radius:10px; border:1px solid var(--purple); background:transparent; color:var(--purple); cursor:pointer; font-size:13px; white-space:nowrap; }
.lib-toolbar button:hover { background:rgba(167,139,250,.12); }
.lib-toolbar button.accent { border-color:var(--accent); color:var(--accent); }
.lib-toolbar button.accent:hover { background:rgba(233,69,96,.12); }
.lib-count { font-size:13px; color:var(--text-dim); margin-bottom:12px; }

.lib-item { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:10px; position:relative; display:flex; align-items:flex-start; gap:12px; }
.lib-item .lib-num { color:var(--purple); font-weight:700; font-size:12px; min-width:36px; padding-top:2px; }
.lib-item .lib-body { flex:1; }
.lib-item .lib-q { font-size:14px; font-weight:500; line-height:1.5; margin-bottom:6px; }
.lib-item .lib-opts { display:flex; flex-wrap:wrap; gap:4px; }
.lib-item .lib-opt-tag { font-size:11px; color:var(--text-dim); background:rgba(255,255,255,.05); padding:3px 10px; border-radius:10px; }
.lib-item .lib-actions { display:flex; gap:6px; margin-left:auto; }
.lib-item .lib-actions button { background:none; border:1px solid var(--border); border-radius:8px; color:var(--text-dim); cursor:pointer; font-size:12px; padding:5px 10px; transition:.2s; white-space:nowrap; }
.lib-item .lib-actions button:hover { border-color:var(--purple); color:var(--purple); }
.lib-item .lib-actions button.promote:hover { border-color:var(--accent); color:var(--accent); }
.lib-item .lib-actions button.danger:hover { border-color:var(--accent); color:var(--accent); background:rgba(233,69,96,.08); }
.lib-item .lib-actions button.save-edit { border-color:var(--success); color:var(--success); }

.lib-item.editing .lib-body { display:flex; flex-direction:column; gap:6px; }
.lib-item.editing .lib-q-edit { width:100%; background:var(--bg); border:1px solid var(--purple); border-radius:8px; padding:8px 12px; color:var(--text); font-size:14px; outline:none; font-family:inherit; }
.lib-item.editing .lib-opts-edit { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:8px 12px; color:var(--text); font-size:12px; outline:none; font-family:inherit; }

.lib-add-form { background:var(--card); border:1px dashed var(--purple); border-radius:14px; padding:20px; margin-bottom:16px; }
.lib-add-form h3 { font-size:15px; color:var(--purple); margin-bottom:14px; }
.lib-add-form .form-row { display:flex; gap:8px; margin-bottom:10px; align-items:center; }
.lib-add-form input { flex:1; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:9px 14px; color:var(--text); font-size:13px; outline:none; }
.lib-add-form input:focus { border-color:var(--purple); }
.lib-add-form button { padding:9px 20px; border-radius:8px; border:none; background:var(--purple); color:#fff; cursor:pointer; font-size:13px; }
.lib-add-form button:hover { filter:brightness(1.1); }
.lib-add-form .hint { font-size:12px; color:var(--text-dim); }

.promoted-badge { background:rgba(233,69,96,.15); color:var(--accent); font-size:10px; padding:2px 8px; border-radius:8px; margin-left:8px; }


/* ===== Category Filter Tabs ===== */
.cat-tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
.cat-tab { padding:6px 14px; border-radius:16px; border:1px solid var(--border); background:transparent; color:var(--text-dim); cursor:pointer; font-size:12px; transition:.2s; white-space:nowrap; }
.cat-tab:hover { border-color:var(--purple); color:var(--purple); }
.cat-tab.active { background:var(--purple); border-color:var(--purple); color:#fff; }
.lib-item .lib-cat-badge { font-size:10px; padding:2px 8px; border-radius:8px; margin-left:8px; background:rgba(167,139,250,.12); color:var(--purple); }

/* ===== Empty State ===== */
.empty-state { text-align:center; padding:48px 20px; color:var(--text-dim); }
.empty-state .icon { font-size:48px; margin-bottom:12px; }

/* ===== Responsive ===== */
@media(max-width:600px) {
  .cat-grid { grid-template-columns:1fr; }
  .header { padding:12px 16px; flex-wrap:wrap; }
  .header h1 { font-size:15px; }
  .lib-item { flex-direction:column; }
  .lib-item .lib-actions { margin-left:0; margin-top:8px; }  .cat-tabs { overflow-x:auto; flex-wrap:nowrap; padding-bottom:4px; }
  .cat-tab { flex-shrink:0; }

}

::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <h1>多研究<span>你自己</span></h1>
  <div class="spacer"></div>
  <button class="nav-btn active" id="btnExplore" onclick="showPage('explore')">探索</button>
  <button class="nav-btn" id="btnRecord" onclick="showPage('record')">📋 记录</button>
  <button class="nav-btn" id="btnLibrary" onclick="showPage('library')">📚 探索库</button>
  <button class="nav-btn" id="btnSummary" onclick="showPage('summary')">✨ 总结</button>
  <div class="stat-pill" id="totalStat">0 条记录</div>
</header>

<main>
  <!-- Explore Page -->
  <div id="pageExplore">
    <div class="cat-grid" id="catGrid"></div>
  </div>

  <!-- Detail View -->
  <div class="detail-view" id="detailView">
    <div class="back-bar">
      <button class="back-btn" onclick="goBack()">← 返回</button>
      <h2 id="detailQ"></h2>
    </div>
    <div class="options-section">
      <div class="section-label">选择你的回答（可多选）</div>
      <div id="optionsArea"></div>
    </div>
    <div class="add-custom-row">
      <input type="text" id="customInput" placeholder="添加自定义选项..." onkeydown="if(event.key==='Enter')addCustomOption()">
      <button onclick="addCustomOption()">+ 添加</button>
    </div>
    <div class="note-area">
      <textarea id="noteInput" placeholder="写下你的想法、感受、备注..."></textarea>
      <div class="save-row">
        <button class="save-btn" id="saveBtn" onclick="saveRecord()">💾 保存这条记录</button>
        <span class="save-msg" id="saveMsg">已保存！</span>
      </div>
    </div>
    <div class="records-list" id="recordsList"></div>
  </div>

  <!-- Record Page -->
  <div class="summary-page" id="pageRecord">
    <h3 style="margin-bottom:18px;font-size:17px;">📋 全部记录</h3>
    <div id="allRecordsList"></div>
  </div>

  <!-- Library Page -->
  <div class="library-page" id="pageLibrary">
    <h3 style="margin-bottom:4px;font-size:17px;">📚 自我探索库</h3>
    <p style="color:var(--text-dim);font-size:13px;margin-bottom:16px;">94 道备用题库 + 自定义题目。可增删改，提成大类的题目会出现在探索页直接使用。</p>

    <div class="lib-add-form" id="libAddForm">
      <h3>＋ 添加新题目</h3>
      <div class="form-row">
        <input type="text" id="newLibQ" placeholder="输入新问题...">
      </div>
      <div class="form-row">
        <input type="text" id="newLibOpts" placeholder="选项（用逗号分隔，如：选项A,选项B,选项C）">
      </div>
      <div class="form-row">
        <select id="newLibCat" style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 14px;color:var(--text);font-size:13px;outline:none;">
          <option value="未分类">分类：未分类</option>
          <option value="基础认知">基础认知</option>
          <option value="行为习惯">行为习惯</option>
          <option value="情绪思维">情绪思维</option>
          <option value="价值观与选择">价值观与选择</option>
          <option value="关系与互动">关系与互动</option>
          <option value="恐惧与阴影">恐惧与阴影</option>
          <option value="潜能与使命">潜能与使命</option>
          <option value="存在与本质">存在与本质</option>
        </select>
        <button onclick="addLibQuestion()">添加</button>
      </div>
      <div class="hint">💡 选项用逗号分隔，如 "咖啡,茶,白水"。别忘了选分类！</div>
    </div>

    <div class="cat-tabs" id="catTabs"></div>
    <div class="lib-toolbar">
      <input type="text" id="libSearch" placeholder="搜索题目关键词..." oninput="renderLibrary()">
      <button class="accent" onclick="document.getElementById('libAddForm').style.display=document.getElementById('libAddForm').style.display==='none'?'block':'none'" style="border-color:var(--purple);color:var(--purple);">＋ 新题目</button>
      <span class="lib-count" id="libCount"></span>
    </div>
    <div id="libList"></div>
  </div>

  <!-- Summary Page -->
  <div class="summary-page" id="pageSummary">
    <div class="profile-card">
      <h3>🧠 你的个性画像</h3>
      <div class="tag-cloud" id="personalityTags"></div>
      <p id="profileDesc" style="font-size:14px;line-height:1.7;color:var(--text-dim);margin-top:12px;"></p>
    </div>
    <div class="stat-grid" id="summaryStats"></div>
    <div id="insightsArea"></div>
  </div>
</main>

<script>
// ========== DATA ==========
const QUESTIONS = [
  { id:1, q:"什么样的早餐/作息，能让你一整上午都精力在线？", options:["豆浆油条/包子 + 7点起床","咖啡+三明治 + 8点左右起","不吃早餐 / 起得很晚","自制营养餐（鸡蛋/燕麦/牛奶）","随缘，有什么吃什么","必须吃热的，温热的东西才舒服","轻断食 / 黑咖啡搞定","早餐要丰盛，午餐可以随意"] },
  { id:2, q:"做哪件事时，你会完全忘记刷手机、进入忘我的心流状态？", options:["写代码 / 解决技术问题","画画 / 设计 / 做手工","阅读 / 看书入迷","打游戏 / 打竞技类游戏","运动 / 跑步 / 健身","做饭 / 研究菜谱","整理房间 / 断舍离","听音乐发呆 / 散步","深度聊天 / 和朋友聊通宵"] },
  { id:3, q:"你最舒服的社交距离是什么？不勉强自己陪笑脸的边界在哪里？", options:["亲密朋友随便来，陌生人别靠近","能线上解决就不见面","喜欢小圈子（3-5人）聚会","一个人待着最舒服","社交场合能应付但不享受","需要定期独处充电","在熟人面前话痨，生人面前社恐","表面社交达人，内心只想回家"] },
  { id:4, q:"你的钱花在哪种地方，会让你觉得「这钱花得值」？", options:["好吃的餐厅 / 点外卖不心疼","电子产品 / 数码装备","旅行 / 出去看世界","买课学习 / 书籍 / 知识付费","衣服 / 鞋子 / 形象管理","给家人朋友买东西","体验类：演唱会/展览/演出","投资理财 / 存钱最有安全感","游戏 / 充值皮肤道具","居家用品 / 提升生活质量的小东西"] },

const BACKUP_VERSION = 2;
const CATEGORY_LIST = ["基础认知", "行为习惯", "情绪思维", "价值观与选择", "关系与互动", "恐惧与阴影", "潜能与使命", "存在与本质", "未分类"];
// ========== STATE ==========
let currentCat = null;
let selectedOptions = new Set();
let customOptions = {}; // { catId: [custom strings] }

// Load data from localStorage
function loadData() { try { const raw = localStorage.getItem('self_explore_records'); return raw ? JSON.parse(raw) : []; } catch { return []; } }
function saveData(data) { localStorage.setItem('self_explore_records', JSON.stringify(data)); }
function loadCustomOptions() { try { const raw = localStorage.getItem('self_explore_custom_opts'); return raw ? JSON.parse(raw) : {}; } catch { return {}; } }
function saveCustomOptions(data) { localStorage.setItem('self_explore_custom_opts', JSON.stringify(data)); }
function loadBackupQuestions() {
  try {
    const ver = localStorage.getItem('self_explore_backup_ver');
    const raw = localStorage.getItem('self_explore_backup_qs');
    if (String(ver) !== String(BACKUP_VERSION) || !raw) {
      localStorage.setItem('self_explore_backup_ver', String(BACKUP_VERSION));
      saveBackupQuestions(DEFAULT_BACKUP);
      return [...DEFAULT_BACKUP];
    }
    const data = JSON.parse(raw);
    if (!Array.isArray(data) || data.length === 0) {
      saveBackupQuestions(DEFAULT_BACKUP);
      return [...DEFAULT_BACKUP];
    }
    return data;
  } catch { saveBackupQuestions(DEFAULT_BACKUP); return [...DEFAULT_BACKUP]; }
}
function saveBackupQuestions(data) { localStorage.setItem('self_explore_backup_qs', JSON.stringify(data)); }
function loadPromotedQuestions() {
  try { const raw = localStorage.getItem('self_explore_promoted_qs'); return raw ? JSON.parse(raw) : []; } catch { return []; }
}
function savePromotedQuestions(data) { localStorage.setItem('self_explore_promoted_qs', JSON.stringify(data)); }

function getActiveQuestions() {
  const promoted = loadPromotedQuestions();
  return [...QUESTIONS, ...promoted];
}

// ========== RENDER CATEGORY GRID ==========
function renderCategories() {
  const grid = document.getElementById('catGrid');
  const records = loadData();
  const counts = {};
  records.forEach(r => { counts[r.qid] = (counts[r.qid]||0) + 1; });
  const allQs = getActiveQuestions();

  grid.innerHTML = allQs.map(c => `
    <div class="cat-card" onclick="openCategory(${c.id})" style="${c.source==='promoted'?'border-left:3px solid var(--purple)':''}">
      <div class="num">${c.source==='promoted'?'📌 Q':'Q'}${c.id}</div>
      <div class="q-text">${c.q}</div>
      <div class="count-badge ${counts[c.id]?'has-record':''}">${counts[c.id]?counts[c.id]+' 条记录':'未记录'}</div>
    </div>
  `).join('');
}

// ========== DETAIL VIEW ==========
function openCategory(id) {
  currentCat = id;
  selectedOptions.clear();
  const cat = getActiveQuestions().find(c => c.id === id);
  if (!cat) return;
  document.getElementById('detailQ').textContent = (cat.source==='promoted'?'📌 ':'') + `Q${id}. ${cat.q}`;
  document.getElementById('pageExplore').style.display = 'none';
  document.getElementById('detailView').classList.add('show');
  document.getElementById('noteInput').value = '';
  document.getElementById('saveMsg').classList.remove('show');

  customOptions[id] = loadCustomOptions()[id] || [];
  renderOptions(cat);
  renderRecords(id);
}

function renderOptions(cat) {
  const area = document.getElementById('optionsArea');
  let html = '';
  cat.options.forEach(opt => {
    html += `<span class="option-chip" data-opt="${opt}" onclick="toggleOpt(this,'${opt.replace(/'/g,"\\'")}')">${opt}</span>`;
  });
  html += `<span class="option-chip other" data-opt="__other__" onclick="toggleOpt(this,'__other__')">➕ 其他（自定义文字）</span>`;
  (customOptions[cat.id] || []).forEach(copt => {
    html += `<span class="option-chip custom" data-opt="${copt}" onclick="toggleOpt(this,'${copt.replace(/'/g,"\\'")}')">${copt} ✏️</span>`;
  });
  area.innerHTML = html;
}

function toggleOpt(el, opt) {
  if (selectedOptions.has(opt)) { selectedOptions.delete(opt); el.classList.remove('selected'); }
  else { selectedOptions.add(opt); el.classList.add('selected'); }
}

function addCustomOption() {
  const input = document.getElementById('customInput');
  const val = input.value.trim();
  if (!val) return;
  if (!customOptions[currentCat]) customOptions[currentCat] = [];
  customOptions[currentCat].push(val);
  const allCustom = loadCustomOptions(); allCustom[currentCat] = customOptions[currentCat]; saveCustomOptions(allCustom);
  input.value = '';
  const cat = getActiveQuestions().find(c => c.id === currentCat);
  renderOptions(cat);
  setTimeout(() => {
    const chips = document.querySelectorAll('.option-chip.custom');
    chips[chips.length-1]?.classList.add('selected');
    selectedOptions.add(val);
  }, 50);
}

function saveRecord() {
  if (selectedOptions.size === 0) { alert('请至少选择一个答案'); return; }
  const cat = getActiveQuestions().find(c=>c.id===currentCat);
  if (!cat) return;
  const note = document.getElementById('noteInput').value.trim();
  const records = loadData();
  records.push({
    id: Date.now(), qid: currentCat, q: cat.q,
    options: [...selectedOptions], note: note,
    time: new Date().toLocaleString('zh-CN')
  });
  saveData(records);
  document.getElementById('saveMsg').classList.add('show');
  setTimeout(() => document.getElementById('saveMsg').classList.remove('show'), 2000);
  selectedOptions.clear();
  document.querySelectorAll('.option-chip.selected').forEach(el => el.classList.remove('selected'));
  document.getElementById('noteInput').value = '';
  renderCategories(); renderRecords(currentCat); updateTotalStat();
}

function renderRecords(qid) {
  const list = document.getElementById('recordsList');
  const records = loadData().filter(r => r.qid === qid).reverse();
  if (records.length === 0) { list.innerHTML = '<div class="empty-state"><div class="icon">📝</div>还没有记录，选一个答案开始吧</div>'; return; }
  list.innerHTML = '<div class="section-label">历史记录</div>' +
    records.map(r => `
      <div class="record-item">
        <button class="del-btn" onclick="deleteRecord(${r.id},${qid})">×</button>
        <div class="r-option">${Array.from(r.options).join(' · ')}</div>
        ${r.note ? `<div class="r-note">${r.note}</div>` : ''}
        <div class="r-time">${r.time}</div>
      </div>`).join('');
}

function deleteRecord(id, qid) {
  if (!confirm('确定删除这条记录？')) return;
  saveData(loadData().filter(r => r.id !== id));
  renderCategories(); renderRecords(qid); updateTotalStat();
}

function goBack() {
  document.getElementById('detailView').classList.remove('show');
  document.getElementById('pageExplore').style.display = 'block';
  currentCat = null;
}

// ========== PAGES ==========
function showPage(page) {
  ['pageExplore','detailView','pageRecord','pageLibrary','pageSummary'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.contains('detail-view') ? el.classList.remove('show') : (el.style.display = 'none');
  });
  ['btnExplore','btnRecord','btnLibrary','btnSummary'].forEach(id => document.getElementById(id).classList.remove('active'));

  if (page === 'explore') { document.getElementById('pageExplore').style.display = 'block'; document.getElementById('btnExplore').classList.add('active'); renderCategories(); }
  else if (page === 'record') { document.getElementById('pageRecord').style.display = 'block'; document.getElementById('btnRecord').classList.add('active'); renderAllRecords(); }
  else if (page === 'library') { document.getElementById('pageLibrary').style.display = 'block'; document.getElementById('btnLibrary').classList.add('active'); renderCatTabs(); renderLibrary(); }
  else if (page === 'summary') { document.getElementById('pageSummary').style.display = 'block'; document.getElementById('btnSummary').classList.add('active'); renderSummary(); }
}

// ========== LIBRARY PAGE ==========
let currentCatFilter = '全部';

function renderCatTabs() {
  const qs = loadBackupQuestions();
  const counts = {};
  counts['全部'] = qs.length;
  qs.forEach(item => { const c = item.cat || '未分类'; counts[c] = (counts[c]||0) + 1; });
  const tabs = document.getElementById('catTabs');
  tabs.innerHTML = CATEGORY_LIST.map(c => {
    if (!counts[c]) return '';
    const act = currentCatFilter === c ? ' active' : '';
    return `<button class="cat-tab${act}" onclick="currentCatFilter='${c}';renderCatTabs();renderLibrary();">${c} (${counts[c]})</button>`;
  }).join('') + `<button class="cat-tab${currentCatFilter==='全部'?' active':''}" onclick="currentCatFilter='全部';renderCatTabs();renderLibrary();">全部 (${qs.length})</button>`;
}

function renderLibrary() {
  const list = document.getElementById('libList');
  const search = document.getElementById('libSearch').value.toLowerCase();
  const allQs = loadBackupQuestions();
  const promoted = loadPromotedQuestions();

  document.getElementById('libCount').textContent = `共 ${allQs.length} 题`;
  document.getElementById('libAddForm').style.display = 'none';

  let html = '';
  let visible = 0;
  allQs.forEach((item, idx) => {
    const cat = item.cat || '未分类';
    if (currentCatFilter !== '全部' && cat !== currentCatFilter) return;
    if (search && !item.q.toLowerCase().includes(search)) return;
    visible++;
    const opts = item.opts.split(',').map(o => o.trim()).filter(o => o);
    const isPromoted = promoted.some(p => p.libIdx === idx && p.libQuestion === item.q);
    html += `<div class="lib-item" id="lib-item-${idx}">
        <div class="lib-num">#${idx + 1}${isPromoted ? '<span class="promoted-badge">已提大</span>' : ''}</div>
        <div class="lib-body">
          <div class="lib-q">${item.q}<span class="lib-cat-badge">${cat}</span></div>
          <div class="lib-opts">${opts.slice(0, 8).map(o => `<span class="lib-opt-tag">${o}</span>`).join('')}${opts.length > 8 ? `<span class="lib-opt-tag">+${opts.length - 8} 更多</span>` : ''}</div>
        </div>
        <div class="lib-actions">
          ${isPromoted ? '<button disabled style="opacity:.5">已提大</button>' : '<button class="promote" onclick="promoteQuestion(${idx})">⬆ 提成大类</button>'}
          <button onclick="editLibQuestion(${idx})">✏️ 编辑</button>
          <button class="danger" onclick="deleteLibQuestion(${idx})">🗑 删除</button>
        </div>
      </div>`;
  });

  if (visible === 0) {
    list.innerHTML = '<div class="empty-state"><div class="icon">🔍</div>' + (search || currentCatFilter !== '全部' ? '没有匹配的题目' : '题库为空，添加第一道题吧') + '</div>';
    if (search || currentCatFilter !== '全部') {
      document.getElementById('libCount').textContent = `共 ${visible} 题（筛选前 ${allQs.length} 题）`;
    }
    return;
  }
  list.innerHTML = html;
  if (currentCatFilter !== '全部' || search) {
    document.getElementById('libCount').textContent = `共 ${visible} 题 / ${allQs.length} 题`;
  }
}function addLibQuestion() {
  const q = document.getElementById('newLibQ').value.trim();
  const opts = document.getElementById('newLibOpts').value.trim();
  const cat = document.getElementById('newLibCat').value;
  if (!q) { alert('请输入问题'); return; }
  if (!opts) { alert('请输入至少一个选项'); return; }
  const qs = loadBackupQuestions();
  qs.push({ q, opts, cat });
  saveBackupQuestions(qs);
  document.getElementById('newLibQ').value = '';
  document.getElementById('newLibOpts').value = '';
  document.getElementById('newLibCat').value = '未分类';
  renderCatTabs();
  renderLibrary();
}

function editLibQuestion(idx) {
  const item = document.getElementById('lib-item-' + idx);
  if (!item) return;
  if (item.classList.contains('editing')) {
    const qInput = item.querySelector('.lib-q-edit');
    const oInput = item.querySelector('.lib-opts-edit');
    const cInput = item.querySelector('.lib-cat-edit');
    if (!qInput || !oInput) return;
    const newQ = qInput.value.trim();
    const newOpts = oInput.value.trim();
    const newCat = cInput ? cInput.value : '未分类';
    if (!newQ || !newOpts) { alert('问题和选项不能为空'); return; }
    const qs = loadBackupQuestions();
    qs[idx] = { q: newQ, opts: newOpts, cat: newCat };
    saveBackupQuestions(qs);
    renderCatTabs();
    renderLibrary();
  } else {
    const qs = loadBackupQuestions();
    const itemData = qs[idx];
    const curCat = itemData.cat || '未分类';
    item.classList.add('editing');
    item.querySelector('.lib-body').innerHTML = `
      <input class="lib-q-edit" value="${itemData.q.replace(/"/g,'&quot;')}">
      <input class="lib-opts-edit" value="${itemData.opts.replace(/"/g,'&quot;')}" placeholder="选项用逗号分隔">
      <select class="lib-cat-edit" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:13px;outline:none;">
        ${CATEGORY_LIST.map(c => `<option value="${c}"${c===curCat?' selected':''}>${c}</option>`).join('')}
      </select>
    `;
    item.querySelector('.lib-actions').innerHTML = `
      <button class="save-edit" onclick="editLibQuestion(${idx})">💾 保存</button>
      <button onclick="renderLibrary()">取消</button>
    `;
  }
}

function deleteLibQuestion(idx) {
  if (!confirm('确定删除这道题目？')) return;
  const qs = loadBackupQuestions();
  qs.splice(idx, 1);
  saveBackupQuestions(qs);
  renderLibrary();
}

function promoteQuestion(idx) {
  if (!confirm('确定将这道题提成大类？它会出现在探索页面上，可以直接回答。')) return;
  const qs = loadBackupQuestions();
  const item = qs[idx];
  if (!item) return;
  const opts = item.opts.split(',').map(o => o.trim()).filter(o => o);
  if (opts.length === 0) { alert('这道题没有选项，无法提成大类。请先编辑添加选项。'); return; }

  const promoted = loadPromotedQuestions();
  const newId = 100 + promoted.length;
  promoted.push({
    id: newId,
    q: item.q,
    options: opts,
    source: 'promoted',
    libIdx: idx,
    libQuestion: item.q
  });
  savePromotedQuestions(promoted);
  alert('已提成大类！去探索页面看看吧。');
  renderLibrary();
  renderCategories();
}

function resetBackupLibrary() {
  if (!confirm('确定恢复默认题库？你自定义添加/编辑/删除的题目会被覆盖，但不影响已提成大类的题目。')) return;
  saveBackupQuestions([...DEFAULT_BACKUP]);
  renderLibrary();
}

// ========== ALL RECORDS PAGE ==========
function renderAllRecords() {
  const container = document.getElementById('allRecordsList');
  const records = loadData().reverse();
  if (records.length === 0) { container.innerHTML = '<div class="empty-state"><div class="icon">📭</div>还没有任何记录<br><br>去探索页面回答一些问题吧</div>'; return; }
  container.innerHTML = records.map(r => `
    <div class="record-item">
      <div class="r-option">Q${r.qid}. ${r.q.substring(0,30)}${r.q.length>30?'...':''}</div>
      <div class="r-note">→ ${Array.from(r.options).join(' · ')}</div>
      ${r.note ? `<div class="r-note" style="margin-top:4px;">📝 ${r.note}</div>` : ''}
      <div class="r-time">${r.time}</div>
    </div>`).join('');
}

// ========== SUMMARY PAGE ==========
function renderSummary() { /* unchanged summary logic from original */ 
  const records = loadData();
  document.getElementById('summaryStats').innerHTML = `
    <div class="stat-mini"><div class="label">总记录数</div><div class="value">${records.length}</div></div>
    <div class="stat-mini"><div class="label">已覆盖问题</div><div class="value">${new Set(records.map(r=>r.qid)).size} / ${getActiveQuestions().length}</div></div>
    <div class="stat-mini"><div class="label">首次记录</div><div class="value">${records.length?formatDate(Math.min(...records.map(r=>r.id))):'--'}</div></div>
    <div class="stat-mini"><div class="label">最近记录</div><div class="value">${records.length?formatDate(Math.max(...records.map(r=>r.id))):'--'}</div></div>
  `;
  const tagMap = {};
  records.forEach(r => { r.options.forEach(opt => { opt.split(/[\/\s、]+/).filter(w => w.length >= 2).forEach(w => { tagMap[w] = (tagMap[w]||0) + 1; }); }); if (r.note) { r.note.split(/[，。！？,\s]+/).filter(w => w.length >= 2).forEach(w => { tagMap[w] = (tagMap[w]||0) + 0.5; }); } });
  const sortedTags = Object.entries(tagMap).sort((a,b) => b[1]-a[1]).slice(0, 24);
  const tagsHtml = sortedTags.map(([tag, count]) => { let cls = count >= 3 ? 'personality-tag' : count >= 1.5 ? 'personality-tag neutral' : 'personality-tag warn'; return `<span class="${cls}">${tag}${count>=3?' ×'+Math.round(count):''}</span>`; }).join('');
  document.getElementById('personalityTags').innerHTML = tagsHtml || '<span style="color:var(--text-dim)">回答更多问题后会生成画像标签</span>';
  document.getElementById('profileDesc').innerHTML = generateProfileDesc(records, sortedTags);
  document.getElementById('insightsArea').innerHTML = generateInsights(records);
}

function formatDate(ts) { return new Date(ts).toLocaleDateString('zh-CN',{month:'short',day:'numeric'}); }

function generateProfileDesc(records, tags) {
  if (records.length < 3) return '继续回答更多问题，我会帮你描绘更准确的个性画像 🎨';
  const byQid = {}; records.forEach(r => { byQid[r.qid] = byQid[r.qid] || []; byQid[r.qid].push(r); });
  const insights = [];
  if (byQid[4]) { const o = byQid[4].flatMap(r=>r.options); if (o.some(x=>x.includes('旅行')||x.includes('体验'))) insights.push('你是一个重视**体验大于物质**的人，钱花在「经历」上让你最满足。'); if (o.some(x=>x.includes('电子')||x.includes('数码'))) insights.push('你对**科技产品和数字装备**情有独钟。'); if (o.some(x=>x.includes('存钱')||x.includes('理财'))) insights.push('你有较强的**安全意识**，储蓄和理财给你带来内心的踏实感。'); if (o.some(x=>x.includes('美食')||x.includes('餐厅')||x.includes('外卖'))) insights.push('你是典型的**吃货型消费者**，「吃得好」是生活品质的核心指标。'); }
  if (byQid[3]) { const o = byQid[3].flatMap(r=>r.options); if (o.some(x=>x.includes('一个人')||x.includes('独处'))) insights.push('你在社交上是**内向充能型**，独处是你的能量来源而非消耗。'); if (o.some(x=>x.includes('小圈子')||x.includes('熟人'))) insights.push('你偏好**深度关系胜过广度社交**。'); if (o.some(x=>x.includes('应付'))) insights.push('你具备不错的**社交弹性**，适应性很强。'); }
  if (byQid[7]) { const o = byQid[7].flatMap(r=>r.options); if (o.some(x=>x.includes('创作')||x.includes('内容'))) insights.push('你骨子里是个**创作者**，表达欲和创造力是你工作的核心驱动力。'); if (o.some(x=>x.includes('技术')||x.includes('代码'))) insights.push('你是一个**逻辑驱动型**的人。'); if (o.some(x=>x.includes('自由'))) insights.push('你高度重视**自主权**，不喜欢被约束。'); if (o.some(x=>x.includes('稳定'))) insights.push('你对**确定性**有较高需求。'); }
  if (byQid[12]) { const o = byQid[12].flatMap(r=>r.options); if (o.some(x=>x.includes('证明'))) insights.push('你内心深处有一种**证明自己的渴望**。'); if (o.some(x=>x.includes('底气')||x.includes('家人'))) insights.push('你赚钱的动力源于**责任感和爱**。'); if (o.some(x=>x.includes('自由'))) insights.push('你看重的是**金钱背后的选择权**，而不是数字本身。'); }
  if (byQid[16]) { const o = byQid[16].flatMap(r=>r.options); if (o.some(x=>x.includes('靠谱'))) insights.push('你把**可靠性**看作最重要的个人品质。'); if (o.some(x=>x.includes('清醒'))) insights.push('你追求的是**内在的清晰度**。'); if (o.some(x=>x.includes('光芒')||x.includes('厉害'))) insights.push('你有**展现自我的愿望**。'); }
  if (byQid[20]) { const o = byQid[20].flatMap(r=>r.options); if (o.some(x=>x.includes('事业'))) insights.push('目前阶段**事业发展**是你生活的重心。'); if (o.some(x=>x.includes('热爱')||x.includes('烟火气'))) insights.push('你向往的是**有温度的生活**。'); if (o.some(x=>x.includes('自由'))) insights.push('**自由**是你对未来生活的核心期待。'); }
  if (byQid[15]) { const o = byQid[15].flatMap(r=>r.options); if (o.some(x=>x.includes('韧性')||x.includes('爬起来'))) insights.push('你最大的优势是**抗挫折能力**。'); if (o.some(x=>x.includes('善良')||x.includes('真诚'))) insights.push('你以**善良和真诚**为傲。'); if (o.some(x=>x.includes('寻找'))) insights.push('你可能正在经历一段**自我探索期**，这本身就是一种勇气。'); }
  if (insights.length === 0) return '继续回答更多问题，我会帮你描绘更准确的个性画像 🎨';

function generateInsights(records) {
  if (records.length < 2) return '';
  const byQid = {}; records.forEach(r => { byQid[r.qid] = byQid[r.qid] || []; byQid[r.qid].push(r); });
  let html = '<h3 style="margin:24px 0 14px;font-size:17px;">🔍 深度洞察</h3>';
  const checks = [];
  if (byQid[3] && byQid[11]) { const s = byQid[3].flatMap(r=>r.options).join(''); const a = byQid[11].flatMap(r=>r.options).join(''); if ((s.includes('一个人')||s.includes('独处')) && (a.includes('刷手机')||a.includes('追剧')||a.includes('发呆'))) checks.push({t:'🏠 社交与独处模式',d:'你喜欢独处，但独处时倾向于**被动式休闲**（刷手机/追剧）。试试在独处时加入一些主动创造的活动（写作/运动/学习），可能会让你的独处质量更高。'}); }
  if (byQid[4] && byQid[12]) { const sp = byQid[4].flatMap(r=>r.options).join(''); const w = byQid[12].flatMap(r=>r.options).join(''); if (sp.includes('存钱')&&sp.includes('理财') && w.includes('证明')) checks.push({t:'💰 金钱的矛盾',d:'你的消费行为偏保守（存钱/理财），但赚钱动力却包含「证明自己」。这意味着你可能**对自己不够自信**，需要通过积累来建立安全感。'}); }
  if (byQid[14]) { const r = byQid[14].flatMap(r=>r.options).join(''); if (r.includes('硬扛') || r.includes('什么都不做')) checks.push({t:'💊 情绪恢复策略',d:'你倾向于**独自消化负面情绪**。偶尔试着向信任的人倾诉——分担痛苦不会让你变弱。'}); if (r.includes('大吃') && r.includes('睡觉')) checks.push({t:'🍜 情绪恢复策略',d:'你通过**基本生理需求**（吃/睡）来恢复情绪。这是最原始也最有效的方式之一。'}); }
  checks.forEach(c => { html += `<div class="insight-block"><h4>${c.t}</h4><p>${c.d}</p></div>`; });
  const allOpts = {}; records.forEach(r => { r.options.forEach(o => { allOpts[o] = (allOpts[o]||0)+1; }); });
  const topOpts = Object.entries(allOpts).sort((a,b)=>b[1]-a[1]).slice(0,8);
  if (topOpts.length > 0) { html += '<h3 style="margin:24px 0 14px;font-size:17px;">📊 高频选择 TOP 8</h3><div class="tag-cloud">'; topOpts.forEach(([opt,count]) => { html += `<span class="personality-tag">${opt} (${count}次)</span>`; }); html += '</div>'; }
  if (records.length >= 5) { const dates = records.map(r => new Date(r.time).toLocaleDateString('zh-CN')); const u = new Set(dates).size; html += `<div class="insight-block" style="margin-top:16px;"><h4>📅 使用习惯</h4><p>你在 <strong>${u}</strong> 天内记录了 <strong>${records.length}</strong> 条回答。${u >= 3 ? '保持这个频率，持续记录会让你的自我认知越来越清晰。' : '建议养成定期记录的习惯，每周回答2-3个问题就能逐渐看清自己的模式。'}</p></div>`; }
  return html;
}

// ========== INIT ==========
function updateTotalStat() { document.getElementById('totalStat').textContent = loadData().length + ' 条记录'; }

// Ensure backup questions exist on first load
if (!localStorage.getItem('self_explore_backup_ver') || localStorage.getItem('self_explore_backup_ver') !== String(BACKUP_VERSION)) { localStorage.setItem('self_explore_backup_ver', String(BACKUP_VERSION)); saveBackupQuestions([...DEFAULT_BACKUP]); }

renderCategories();
updateTotalStat();
